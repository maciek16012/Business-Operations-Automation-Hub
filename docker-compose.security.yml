services:
  clamav:
    build: ./security/clamav
    volumes:
      - clamav_signatures:/var/lib/clamav
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
  backend:
    environment:
      SECURITY_PREFLIGHT_ENABLED: "true"
      SECURITY_FAIL_CLOSED: "true"
      STP_ENABLED: "true"
      CLAMAV_HOST: clamav
      REVIEW_NOTIFICATIONS_ENABLED: "true"
      REVIEW_NOTIFICATION_WEBHOOK_URL: http://n8n:5678/webhook/boah-review-m5
  review-worker:
    build: ./backend
    command: ["python", "-m", "app.services.notifications"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boah}:${POSTGRES_PASSWORD:-boah_dev_password}@postgres:5432/${POSTGRES_DB:-boah}
      REVIEW_NOTIFICATIONS_ENABLED: "true"
      REVIEW_NOTIFICATION_WEBHOOK_URL: http://n8n:5678/webhook/boah-review-m5
    volumes: ["./backend:/app"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  clamav_signatures:
