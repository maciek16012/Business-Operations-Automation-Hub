# Standalone production deployment. Do NOT merge with development compose files.
x-app: &app
  build: {context: ./backend, dockerfile: Dockerfile.production}
  env_file: [.env.production]
  environment: &app-env
    APP_ENV: production
    AUTH_ENABLED: "true"
    AUTH_COOKIE_SECURE: "true"
    DEBUG: "false"
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-boah}:${POSTGRES_PASSWORD:?set a strong production database password}@postgres:5432/${POSTGRES_DB:-boah}
    BOAH_MASTER_KEY_FILE: /run/secrets/boah_master_key
    PUBLIC_URL: https://${BOAH_DOMAIN:?set the public HTTPS domain}
    BACKEND_CORS_ORIGINS: https://${BOAH_DOMAIN}
    CONNECTOR_ALLOW_PLAINTEXT_TEST: "false"
    SECURITY_PREFLIGHT_ENABLED: "true"
    SECURITY_FAIL_CLOSED: "true"
    CLAMAV_HOST: clamav
    OCR_ENABLED: "true"
    OCR_TESSERACT_URL: http://tesseract:8080/ocr
    OCR_PADDLE_URL: http://paddle:8080/ocr
    OCR_TESSERACT_PROFILE: orientation
    OCR_PADDLE_PROFILE: orientation
    STP_ENABLED: "true"
    STORAGE_PATH: /data/documents
    MOUNTED_ROOTS: '{"incoming":"/mnt/incoming","archive":"/mnt/archive"}'
    REVIEW_NOTIFICATION_WEBHOOK_URL: http://n8n:5678/webhook/boah-review-m5
  secrets: [boah_master_key]
  volumes:
    - boah_files:/data/documents
    - ${BOAH_INCOMING_PATH:?set mounted intake directory}:/mnt/incoming:ro
    - ${BOAH_ARCHIVE_PATH:?set mounted archive directory}:/mnt/archive
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  proxy:
    image: caddy:2.11-alpine
    environment: {BOAH_DOMAIN: "${BOAH_DOMAIN}"}
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/milestone7/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on: {frontend: {condition: service_healthy}, backend: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:2019/config/]
      interval: 30s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boah}
      POSTGRES_USER: ${POSTGRES_USER:-boah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set strong password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      retries: 10
  backend:
    <<: *app
    depends_on: {postgres: {condition: service_healthy}, clamav: {condition: service_healthy}, tesseract: {condition: service_healthy}, paddle: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 15s
      retries: 5
  delivery-worker:
    <<: *app
    command: [python, -m, app.company.worker]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, app.company.check_worker, delivery]
      interval: 30s
      timeout: 10s
  review-worker:
    <<: *app
    command: [python, -m, app.services.notifications]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, app.company.check_worker, review]
      interval: 30s
      timeout: 10s
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile.production}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
  clamav:
    build: ./security/clamav
    volumes: [clamav_signatures:/var/lib/clamav]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 120s
  tesseract:
    build: ./ocr-services/tesseract
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
  paddle:
    build: ./ocr-services/paddle
    volumes: [paddle_models:/root/.paddlex]
    shm_size: 2gb
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777", "/root/.cache:size=512m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      retries: 30
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    environment:
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_PRUNE: "true"
    volumes: [n8n_data:/home/node/.n8n, "./n8n/workflows:/workflows:ro"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
secrets:
  boah_master_key:
    file: ${BOAH_MASTER_KEY_PATH:?set a protected master key file outside source control}
volumes:
  postgres_data:
  boah_files:
  n8n_data:
  paddle_models:
  clamav_signatures:
  caddy_data:
  caddy_config:
