[project]
name = "boah-backend"
version = "0.1.0"
description = "Backend for Business Operations Automation Hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "openpyxl>=3.1,<4",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<0.29",
  "pymupdf==1.28.2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=46,<50",
  "paramiko>=4,<5",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "aiosqlite>=0.21,<1",
  "types-openpyxl>=3.1,<4",
  "types-paramiko>=5.0.0.20260724",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
]
